    <script>
      try {
        const t = JSON.parse(localStorage.getItem("kz_active_theme"));
        if (t?.colors?.primary)
          document.documentElement.style.setProperty(
            "--theme-color-mauve",
            t.colors.primary,
          );
      } catch {}
    </script>
